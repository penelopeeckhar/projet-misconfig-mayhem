version: '3.8'

services:
  # Base de données PostgreSQL
  db:
    image: postgres:15
    container_name: sharedb
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: sharedb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sharepy-network

  # Stockage de fichiers MinIO
  minio:
    image: minio/minio:latest
    container_name: shareminio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - sharepy-network

  # Application FastAPI
  app:
    build: ./app
    container_name: shareapp
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://admin:password123@db:5432/sharedb
      - ADMIN_PASSWORD=admin123
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - db
      - minio
    networks:
      - sharepy-network

  # Nginx reverse proxy
  nginx:
    image: nginx:latest
    container_name: sharenginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./uploads:/app/uploads:ro
    depends_on:
      - app
    networks:
      - sharepy-network

volumes:
  postgres_data:
  minio_data:

networks:
  sharepy-network:
    driver: bridge
