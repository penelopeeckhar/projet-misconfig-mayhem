events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ✅ Logs en mode production (moins verbeux)
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;  # ✅ warn au lieu de debug

    server {
        listen 80;
        server_name localhost;

        # ✅ CORRECTION : Masquer la version de Nginx
        server_tokens off;

        # ✅ BONUS : Headers de sécurité
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self'" always;

        # ✅ HSTS (HTTPS strict transport security)
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Proxy vers FastAPI
        location /api {
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = / {
            proxy_pass http://app:8000/;
        }

        location /login {
            proxy_pass http://app:8000/login;
        }

        location /upload {
            proxy_pass http://app:8000/upload;
            # ✅ Limiter la taille des uploads
            client_max_body_size 10M;
        }

        location /files {
            proxy_pass http://app:8000/files;
        }

        location /download {
            proxy_pass http://app:8000/download;
        }

        location /health {
            proxy_pass http://app:8000/health;
        }

        # ✅ CORRECTION M3 : Directory listing DÉSACTIVÉ
        location /uploads {
            alias /app/uploads/;
            autoindex off;  # ✅ DÉSACTIVÉ
            
            # ✅ Bloquer l'accès direct
            deny all;
            
            # Note : Les fichiers doivent être téléchargés via /download/{filename}
        }

        # ✅ Bloquer l'accès à /debug (même si supprimé dans FastAPI)
        location /debug {
            deny all;
            return 404;
        }

        # Page d'erreur sans révéler de chemins
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }

        # ✅ Bloquer l'accès aux fichiers sensibles
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
